[project]
name = "vision-deporte"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "mediapy>=1.2.7",
    "mujoco>=3.14.0",
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "pygame>=2.6.1",
    "pyqt6>=6.11.0",
    "scipy>=1.18.1",
    "stable-baselines3>=2.9.0",
    "tensorboard>=2.21.0",
    "tensorflow[and-cuda]>=2.21.0",
    "tk>=0.1.0",
    "torch>=2.14.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[project.scripts]
vision-deporte = "vision_deporte:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
